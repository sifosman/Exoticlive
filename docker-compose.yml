version: '3.4'
services:
  typesense:
    image: typesense/typesense:0.25.1
    ports:
      - "8108:8108"
    volumes:
      - ./typesense-data:/data
    environment:
      - TYPESENSE_API_KEY=xyz123 # Replace this with your own secure API key
      - TYPESENSE_DATA_DIR=/data
    command: "--enable-cors"
